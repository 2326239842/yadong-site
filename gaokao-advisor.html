<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪峰AI — 甘肃高考志愿智能推荐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#111827;--border:#1e293b;--accent:#10b981;--accent2:#6366f1;--warn:#f59e0b;--red:#ef4444;--txt:#e2e8f0;--dim:#94a3b8;--glass:rgba(255,255,255,.03)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:16px}

/* Header */
.header{text-align:center;padding:32px 0 24px;background:linear-gradient(135deg,#10b981 0%,#6366f1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header h1{font-size:28px;font-weight:800;letter-spacing:2px}
.header p{font-size:13px;color:var(--dim);-webkit-text-fill-color:var(--dim);margin-top:8px}

/* Input Section */
.input-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.input-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:600px){.input-row{grid-template-columns:1fr 1fr}}
.input-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;font-weight:600}
.input-group input,.input-group select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font-size:15px;outline:none;transition:border .2s}
.input-group input:focus,.input-group select:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,#10b981,#6366f1);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(16,185,129,.3)}
.btn-primary:active{transform:translateY(0)}

/* Results */
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.icon-chong{background:rgba(239,68,68,.15);color:var(--red)}
.icon-wen{background:rgba(16,185,129,.15);color:var(--accent)}
.icon-bao{background:rgba(99,102,241,.15);color:var(--accent2)}
.icon-policy{background:rgba(245,158,11,.15);color:var(--warn)}

/* School Cards */
.school-grid{display:grid;gap:8px}
.school-card{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;transition:border .2s}
.school-card:hover{border-color:var(--accent)}
.school-name{font-weight:600;font-size:14px}
.school-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600}
.tag-985{background:rgba(239,68,68,.15);color:var(--red)}
.tag-211{background:rgba(99,102,241,.15);color:var(--accent2)}
.tag-df{background:rgba(16,185,129,.15);color:var(--accent)}
.school-meta{font-size:12px;color:var(--dim);margin-top:2px}
.school-score{text-align:right}
.school-score .score{font-size:20px;font-weight:800;color:var(--accent)}
.school-score .rank{font-size:11px;color:var(--dim)}

/* Policy */
.policy-item{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.policy-title{font-weight:600;font-size:14px;color:var(--warn);margin-bottom:6px}
.policy-content{font-size:13px;color:var(--dim);white-space:pre-wrap;line-height:1.8}
.policy-doc{font-size:11px;color:var(--accent);margin-top:4px}

/* Batch Lines */
.batch-table{width:100%;border-collapse:collapse;font-size:13px}
.batch-table th{background:rgba(99,102,241,.1);padding:8px 12px;text-align:left;font-weight:600;border-bottom:1px solid var(--border)}
.batch-table td{padding:8px 12px;border-bottom:1px solid var(--border)}

/* Score Distribution Chart */
.chart-container{height:200px;position:relative;margin-top:12px}
.chart-bar{position:absolute;bottom:0;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:3px 3px 0 0;transition:height .3s;cursor:pointer}
.chart-bar:hover{opacity:.8}
.chart-tooltip{position:absolute;top:-30px;background:var(--card);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:11px;white-space:nowrap;display:none;pointer-events:none;z-index:10}

/* Info Banner */
.info-banner{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(99,102,241,.1));border:1px solid rgba(16,185,129,.2);border-radius:12px;padding:16px;margin-bottom:20px;font-size:13px;color:var(--dim);line-height:1.8}
.info-banner strong{color:var(--accent)}

/* Sources */
.sources{font-size:11px;color:var(--dim);text-align:center;padding:20px 0;border-top:1px solid var(--border);margin-top:20px}
.sources a{color:var(--accent);text-decoration:none}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--dim)}
.loading .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tab */
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--glass);color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Hidden */
.hidden{display:none}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>🎓 雪峰AI</h1>
  <p>甘肃高考志愿智能推荐 · 数据驱动 · 官方来源</p>
</div>

<div class="info-banner">
  <strong>📊 数据来源说明：</strong><br>
  ① 录取分数：百度高考API（官方合作数据，2024年）<br>
  ② 一分一段表：甘肃省教育考试院公开数据<br>
  ③ 批次线/政策：甘肃省教育考试院官网(ganseea.cn)<br>
  ④ 学校标签：教育部985/211/双一流名单<br>
  <strong>⚠ 所有数据均来自官方渠道，仅供参考，最终以甘肃省教育考试院公布为准</strong>
</div>

<div class="input-card">
  <div class="input-row">
    <div class="input-group">
      <label>省份</label>
      <select id="province">
        <option value="甘肃" selected>甘肃</option>
      </select>
    </div>
    <div class="input-group">
      <label>科类</label>
      <select id="category">
        <option value="物理类" selected>物理类</option>
        <option value="历史类">历史类</option>
      </select>
    </div>
    <div class="input-group">
      <label>年份</label>
      <select id="year">
        <option value="2024" selected>2024</option>
      </select>
    </div>
  </div>
  <div class="input-row">
    <div class="input-group">
      <label>分数</label>
      <input type="number" id="score" placeholder="如 550" min="0" max="750">
    </div>
    <div class="input-group">
      <label>位次</label>
      <input type="number" id="rank" placeholder="如 10000" min="0">
    </div>
    <div class="input-group">
      <label>&nbsp;</label>
      <button class="btn btn-primary" onclick="search()">🔍 智能推荐</button>
    </div>
  </div>
</div>

<div id="results">
  <div class="section" id="batchSection">
    <div class="section-title"><span class="icon icon-policy">📋</span> 批次线</div>
    <div id="batchContent"></div>
  </div>
  <div class="section" id="policySection">
    <div class="section-title"><span class="icon icon-policy">📖</span> 招生政策</div>
    <div id="policyContent"></div>
  </div>
</div>

<div id="searchResults" class="hidden"></div>

<div class="sources">
  数据来源：<a href="https://gaokao.baidu.com" target="_blank">百度高考</a> · 
  <a href="https://www.ganseea.cn" target="_blank">甘肃省教育考试院</a> · 
  <a href="https://github.com/sdgedfegw/Gaokao-score-distribution" target="_blank">一分一段数据集</a><br>
  © 2025 雪峰AI · 仅供志愿填报参考
</div>

</div>

<script>
let DATA = null;

async function loadData() {
  try {
    const resp = await fetch('web_data.json');
    DATA = await resp.json();
    renderBatchLines();
    renderPolicies();
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="section"><p style="color:var(--red)">数据加载失败: ' + e.message + '</p></div>';
  }
}

function renderBatchLines() {
  if (!DATA || !DATA.batchLines.length) return;
  let html = '<table class="batch-table"><tr><th>年份</th><th>科类</th><th>批次</th><th>分数线</th></tr>';
  DATA.batchLines.forEach(b => {
    html += `<tr><td>${b.year}</td><td>${b.cat}</td><td>${b.batch}</td><td><strong>${b.score}</strong></td></tr>`;
  });
  html += '</table>';
  document.getElementById('batchContent').innerHTML = html;
}

function renderPolicies() {
  if (!DATA || !DATA.policies.length) return;
  let html = '';
  DATA.policies.forEach(p => {
    html += `<div class="policy-item">
      <div class="policy-title">${p.title}</div>
      <div class="policy-content">${p.content}</div>
      ${p.doc ? '<div class="policy-doc">文号: ' + p.doc + '</div>' : ''}
    </div>`;
  });
  document.getElementById('policyContent').innerHTML = html;
}

function search() {
  const score = parseInt(document.getElementById('score').value);
  const rank = parseInt(document.getElementById('rank').value);
  const category = document.getElementById('category').value;
  
  if (!score && !rank) {
    alert('请输入分数或位次');
    return;
  }
  if (!DATA) {
    alert('数据加载中，请稍候');
    return;
  }

  const targetScore = score || 0;
  const targetRank = rank || 0;

  // 分类：冲/稳/保
  const chong = [], wen = [], bao = [];
  const seen = new Set();
  
  DATA.scores.forEach(s => {
    if (seen.has(s.school)) return;
    seen.add(s.school);
    
    const diff = s.score - targetScore;
    const rankDiff = targetRank > 0 && s.rank > 0 ? s.rank - targetRank : 0;
    
    if (targetScore > 0) {
      if (diff > 0 && diff <= 30) chong.push(s);
      else if (diff >= -10 && diff <= 10) wen.push(s);
      else if (diff >= -40 && diff < -10) bao.push(s);
    } else if (targetRank > 0) {
      if (rankDiff < -2000) chong.push(s);
      else if (Math.abs(rankDiff) <= 3000) wen.push(s);
      else if (rankDiff > 3000 && rankDiff <= 15000) bao.push(s);
    }
  });

  // 排序
  chong.sort((a,b) => b.score - a.score);
  wen.sort((a,b) => Math.abs(a.score - targetScore) - Math.abs(b.score - targetScore));
  bao.sort((a,b) => b.score - a.score);

  // 渲染
  let html = '';
  
  // 一分一段
  if (targetScore > 0) {
    const dist = DATA.distribution.filter(d => Math.abs(d.score - targetScore) <= 3);
    if (dist.length) {
      html += '<div class="section"><div class="section-title"><span class="icon icon-policy">📊</span> 一分一段（2024）</div>';
      html += '<table class="batch-table"><tr><th>分数</th><th>本段人数</th><th>累计人数</th></tr>';
      dist.forEach(d => {
        html += `<tr><td><strong>${d.score}</strong></td><td>${d.count}人</td><td>${d.cum}人</td></tr>`;
      });
      html += '</table></div>';
    }
  }

  html += renderSchoolSection('🔴 冲一冲（录取分高于你分数）', chong, 'chong', 15);
  html += renderSchoolSection('🟢 稳一稳（录取分接近你分数）', wen, 'wen', 15);
  html += renderSchoolSection('🟣 保一保（录取分低于你分数）', bao, 'bao', 15);

  if (!html) {
    html = '<div class="section"><p style="color:var(--dim);text-align:center">暂无匹配数据，请尝试调整分数/位次</p></div>';
  }

  const container = document.getElementById('searchResults');
  container.innerHTML = html;
  container.classList.remove('hidden');
  container.scrollIntoView({behavior:'smooth'});
}

function renderSchoolSection(title, schools, type, limit) {
  if (!schools.length) return '';
  const iconClass = type === 'chong' ? 'icon-chong' : type === 'wen' ? 'icon-wen' : 'icon-bao';
  let html = `<div class="section"><div class="section-title"><span class="icon ${iconClass}">${type==='chong'?'🔥':type==='wen'?'✅':'🛡️'}</span> ${title}（${schools.length}所）</div><div class="school-grid">`;
  schools.slice(0, limit).forEach(s => {
    const schoolInfo = DATA.schools.find(sc => sc.name === s.school);
    let tags = '';
    if (schoolInfo) {
      if (schoolInfo.q985) tags += '<span class="school-tag tag-985">985</span>';
      if (schoolInfo.q211) tags += '<span class="school-tag tag-211">211</span>';
      if (schoolInfo.df) tags += '<span class="school-tag tag-df">双一流</span>';
    }
    html += `<div class="school-card">
      <div>
        <div class="school-name">${s.school}${tags}</div>
        <div class="school-meta">${s.batch || ''} · 2024</div>
      </div>
      <div class="school-score">
        <div class="score">${s.score || '-'}<span style="font-size:12px;color:var(--dim)">分</span></div>
        <div class="rank">${s.rank ? '位次' + s.rank.toLocaleString() : ''}</div>
      </div>
    </div>`;
  });
  html += '</div></div>';
  return html;
}

loadData();
</script>
</body>
</html>
